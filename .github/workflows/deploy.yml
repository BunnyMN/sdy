name: Deploy to Production (e-sdy.mn)

# Монголын Залуучуудын Холбооны дотоод системийг e-sdy.mn (5.45.65.164) дээр
# гаргах ажиллагаа. Lint, тест, build нь ci.yml-д; энэ файл нь CI ногоон болсон
# commit-ийн image-ийг GHCR-д түлхээд хост руу ssh-ээр гаргана.
#
# CI-г дуустал хүлээдэг (workflow_run), push дээр шууд биш: хоёр тус тусдаа
# ногоон PR main дээр нийлээд эвдэрч болно, тэр нь яг автоматаар гаргах ёсгүй
# тохиолдол.
#
# Урсгал:
#   ghcr.io/<owner>/<repo>/{backend,frontend} image бүтээж түлхэх (tag = sha, latest)
#     ↓
#   хост руу ssh: compose + brand хуулах → .env шинээр бичих → pull → migrate → restart
#     ↓
#   /health, /ready, нүүр хуудас шалгах
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY              deploy хэрэглэгчийн хувийн түлхүүр (заавал)
#   DEPLOY_HOST                 анхдагч 5.45.65.164
#   DEPLOY_USER                 анхдагч deploy
#   DEPLOY_PORT                 анхдагч 22
#   POSTGRES_PASSWORD           өгөгдлийн сангийн нууц үг (заавал)
#   SSO_DEFAULT_CLIENT_SECRET   built-in OAuth2 клиентийн нууц (заавал)
#   INTEGRATION_ENCRYPTION_KEY  хадгалагдах итгэмжлэлийн шифр, `openssl rand -base64 32` (заавал)
#   GEMINI_API_KEY              AI туслах (сонголттой)
#   EID_RP_UUID / EID_RP_SECRET eID Mongolia relying party «SDY Platform» (байхгүй бол eID унтраа)
#   GEREGE_CORE_TOKEN           Gerege Core лавлагаа (сонголттой)
#   GOOGLE_LOGIN_CLIENT_ID / _SECRET  Google нэвтрэлт (сонголттой)
#
# Repository variables (нууц биш):
#   PUBLIC_ORIGIN               анхдагч https://e-sdy.mn
#   CONTROL_PLANE_HOST          анхдагч admin.e-sdy.mn
#   DEMO_MODE                   "true" бол demo account + mock eID/ДАН/ХУР; анхдагч false
#   PLATFORM_ACCESS_MODE        public | private (анхдагч private); e-sdy.mn дээр public
#   EID_MOCK_MODE               анхдагч false
#   EID_APP_CALLBACKS           анхдагч gerege-nexus://auth
#   EID_BASE_URL                анхдагч https://eidmongolia.mn/v3
#   GOOGLE_LOGIN_TENANT, GOOGLE_LOGIN_ALLOWED_DOMAINS
#
# Хост дээр урьдчилан байх ёстой (docs/MZH.md → «Сервер»): Docker, nginx
# (e-sdy.mn ба admin.e-sdy.mn vhost, TLS), `deploy` хэрэглэгч docker бүлэгт,
# /opt/sdy нь deploy-ийнх. admin.e-sdy.mn-ийн IP allowlist
# (/etc/nginx/snippets/cp-allowlist.conf) нь хост дээр root-оор засагддаг,
# энэ ажиллагаа түүнд хүрдэггүй.

on:
  workflow_run:
    # ci.yml-ийн `name:`-тэй яг таарна.
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (defaults to this commit)"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: production-host-rollout
  cancel-in-progress: false

env:
  PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN || 'https://e-sdy.mn' }}
  CONTROL_PLANE_HOST: ${{ vars.CONTROL_PLANE_HOST || 'admin.e-sdy.mn' }}
  DEMO_MODE: ${{ vars.DEMO_MODE || 'false' }}
  # private (анхдагч) — зөвхөн урилгаар; public — eID-ээр анх нэвтэрсэн хүнд
  # данс автоматаар үүснэ. Гишүүн бүр өөрөө бүртгүүлдэг холбооны системд public.
  PLATFORM_ACCESS_MODE: ${{ vars.PLATFORM_ACCESS_MODE || 'private' }}
  EID_MOCK_MODE: ${{ vars.EID_MOCK_MODE || 'false' }}
  EID_APP_CALLBACKS: ${{ vars.EID_APP_CALLBACKS || 'gerege-nexus://auth' }}
  EID_BASE_URL: ${{ vars.EID_BASE_URL || 'https://eidmongolia.mn/v3' }}
  REDIS_URL: ${{ vars.REDIS_URL || 'redis://redis:6379/0' }}
  APP_DIR: /opt/sdy
  STACK: sdy

jobs:
  build-and-push:
    name: Build and push ${{ matrix.component }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: deploy/Dockerfile
          - component: frontend
            context: ./frontend
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR том үсэгтэй замыг хүлээж авдаггүй.
      - name: Compute image name
        id: meta
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Resolve the platform version
        id: version
        run: |
          value=$(grep -oE 'PlatformVersion = "[^"]+"' backend/internal/kernel/config/version.go | cut -d'"' -f2)
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.event.workflow_run.head_sha || github.sha }}
          # NEXT_PUBLIC_API_URL санаатайгаар өгөхгүй: хоосон бол хөтөч өөрийг нь
          # үйлчилсэн хостоос асууна (frontend/lib/apiBase.ts).
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: Roll out to e-sdy.mn
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: ${{ vars.PUBLIC_ORIGIN || 'https://e-sdy.mn' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Хоосон нууц .env-д хоосон мөр болж бичигдээд платформ түүгээрээ асдаг.
      # Тиймээс байх ёстой утгуудыг эхний байт серверт хүрэхээс өмнө шалгана —
      # зөвхөн нэрийг нь хэвлэнэ.
      - name: Check the required secrets are present
        id: guard
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SSO_DEFAULT_CLIENT_SECRET: ${{ secrets.SSO_DEFAULT_CLIENT_SECRET }}
          INTEGRATION_ENCRYPTION_KEY: ${{ secrets.INTEGRATION_ENCRYPTION_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::DEPLOY_SSH_KEY is not configured — skipping rollout."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          for name in POSTGRES_PASSWORD SSO_DEFAULT_CLIENT_SECRET INTEGRATION_ENCRYPTION_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::These deployment secrets are empty and would be written to the server as blank lines:$missing"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        id: tag
        run: echo "value=${{ github.event.inputs.tag || github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      # Compose файл ба брэндийн хавтас. brand/ нь /brand:ro гэж mount хийгддэг
      # тул copy.json хостод байх ёстой.
      - name: Copy compose file and brand to the server
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST || '5.45.65.164' }}
          username: ${{ secrets.DEPLOY_USER || 'deploy' }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,brand/copy.json,brand/README.md"
          target: ${{ env.APP_DIR }}

      - name: Pull images, migrate and restart
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SSO_DEFAULT_CLIENT_SECRET: ${{ secrets.SSO_DEFAULT_CLIENT_SECRET }}
          INTEGRATION_ENCRYPTION_KEY: ${{ secrets.INTEGRATION_ENCRYPTION_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EID_RP_UUID: ${{ secrets.EID_RP_UUID }}
          EID_RP_SECRET: ${{ secrets.EID_RP_SECRET }}
          GEREGE_CORE_TOKEN: ${{ secrets.GEREGE_CORE_TOKEN }}
          GOOGLE_LOGIN_CLIENT_ID: ${{ secrets.GOOGLE_LOGIN_CLIENT_ID }}
          GOOGLE_LOGIN_CLIENT_SECRET: ${{ secrets.GOOGLE_LOGIN_CLIENT_SECRET }}
          GOOGLE_LOGIN_TENANT: ${{ vars.GOOGLE_LOGIN_TENANT }}
          GOOGLE_LOGIN_ALLOWED_DOMAINS: ${{ vars.GOOGLE_LOGIN_ALLOWED_DOMAINS }}
          PUBLIC_ORIGIN: ${{ env.PUBLIC_ORIGIN }}
          CONTROL_PLANE_HOST: ${{ env.CONTROL_PLANE_HOST }}
          DEMO_MODE: ${{ env.DEMO_MODE }}
          PLATFORM_ACCESS_MODE: ${{ env.PLATFORM_ACCESS_MODE }}
          EID_MOCK_MODE: ${{ env.EID_MOCK_MODE }}
          EID_APP_CALLBACKS: ${{ env.EID_APP_CALLBACKS }}
          EID_BASE_URL: ${{ env.EID_BASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          APP_DIR: ${{ env.APP_DIR }}
          STACK: ${{ env.STACK }}
        with:
          host: ${{ secrets.DEPLOY_HOST || '5.45.65.164' }}
          username: ${{ secrets.DEPLOY_USER || 'deploy' }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          envs: IMAGE_TAG,REGISTRY_USER,REGISTRY_TOKEN,REPO,POSTGRES_PASSWORD,SSO_DEFAULT_CLIENT_SECRET,INTEGRATION_ENCRYPTION_KEY,GEMINI_API_KEY,EID_RP_UUID,EID_RP_SECRET,GEREGE_CORE_TOKEN,GOOGLE_LOGIN_CLIENT_ID,GOOGLE_LOGIN_CLIENT_SECRET,GOOGLE_LOGIN_TENANT,GOOGLE_LOGIN_ALLOWED_DOMAINS,PUBLIC_ORIGIN,CONTROL_PLANE_HOST,DEMO_MODE,PLATFORM_ACCESS_MODE,EID_MOCK_MODE,EID_APP_CALLBACKS,EID_BASE_URL,REDIS_URL,APP_DIR,STACK
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            REPO_LOWER=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
            PUBLIC_HOST=${PUBLIC_ORIGIN#https://}

            # Ажиллагаа бүрд шинээр бичигдэнэ — хост CI-гаас хэзээ ч зөрөхгүй.
            # Хост дээр гараар нэмсэн мөр дараагийн rollout дээр арчигдана;
            # шинэ тохиргоо нь энэ файлд орно (docs/OPERATIONS.md).
            umask 077
            cat > .env <<EOF
            STACK=${STACK}
            POSTGRES_VOLUME=sdy_postgres_data
            CATALOG_CACHE_VOLUME=sdy_catalog_cache
            IMAGE_BACKEND=ghcr.io/${REPO_LOWER}/backend
            IMAGE_FRONTEND=ghcr.io/${REPO_LOWER}/frontend
            IMAGE_TAG=${IMAGE_TAG}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            SSO_DEFAULT_CLIENT_SECRET=${SSO_DEFAULT_CLIENT_SECRET}
            INTEGRATION_ENCRYPTION_KEY=${INTEGRATION_ENCRYPTION_KEY}
            GEMINI_API_KEY=${GEMINI_API_KEY}
            EID_RP_UUID=${EID_RP_UUID}
            EID_RP_SECRET=${EID_RP_SECRET}
            EID_BASE_URL=${EID_BASE_URL}
            EID_RP_NAME=Монголын Залуучуудын Холбоо
            EID_DISPLAY_TEXT=Монголын Залуучуудын Холбооны системд нэвтрэх
            GEREGE_CORE_TOKEN=${GEREGE_CORE_TOKEN}
            GOOGLE_LOGIN_CLIENT_ID=${GOOGLE_LOGIN_CLIENT_ID}
            GOOGLE_LOGIN_CLIENT_SECRET=${GOOGLE_LOGIN_CLIENT_SECRET}
            GOOGLE_LOGIN_TENANT=${GOOGLE_LOGIN_TENANT}
            GOOGLE_LOGIN_ALLOWED_DOMAINS=${GOOGLE_LOGIN_ALLOWED_DOMAINS}
            PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
            DEVICE_LINE_ORIGINS=https://www.${PUBLIC_HOST}
            CONTROL_PLANE_HOST=${CONTROL_PLANE_HOST}
            DEMO_MODE=${DEMO_MODE}
            PLATFORM_ACCESS_MODE=${PLATFORM_ACCESS_MODE}
            EID_MOCK_MODE=${EID_MOCK_MODE}
            EID_APP_CALLBACKS=${EID_APP_CALLBACKS}
            REDIS_URL=${REDIS_URL}
            GITHUB_REPOSITORY=${REPO}
            # ── Монголын Залуучуудын Холбооны брэнд (docs/MZH.md) ──
            BRAND_NAME=Монголын Залуучуудын Холбоо
            BRAND_SHORT_NAME=МЗХ
            BRAND_DESCRIPTION=Монголын Залуучуудын Холбооны гишүүд, салбар зөвлөл, ажлын албаны нэгдсэн дотоод систем.
            BRAND_LOGO_URL=/mzh/logo.svg
            BRAND_THEME_COLOR=#0b2a6f
            BRAND_ICON_URL=/mzh/icon-512.png
            BRAND_COPY_FILE=/brand/copy.json
            LANDING_SECTIONS=hero capabilities trust services
            SERVICE_URL_ADMIN=https://${CONTROL_PLANE_HOST}
            EOF

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

            # GHCR дөнгөж түлхсэн хувийн image-д "denied" гэж хариулах нь ховор
            # биш; дахин нэвтрээд давтана.
            for attempt in 1 2 3 4 5; do
              if docker compose -f docker-compose.prod.yml pull; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::registry pull still denied after $attempt attempts; the running containers are untouched"
                exit 1
              fi
              echo "pull attempt $attempt failed; re-authenticating and retrying in $((attempt * 15))s"
              sleep "$((attempt * 15))"
              echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            done

            # Хуучныг шинэ нь хост дээр ирсний дараа л буулгана.
            for image in "ghcr.io/${REPO_LOWER}/backend:${IMAGE_TAG}" "ghcr.io/${REPO_LOWER}/frontend:${IMAGE_TAG}"; do
              if ! docker image inspect "$image" >/dev/null 2>&1; then
                echo "::error::$image is not on the host after the pull; refusing to remove the running containers"
                exit 1
              fi
            done

            # Stateless контейнеруудыг л хүчээр авна; PostgreSQL ба volume нь
            # хэвээр. Graceful stop асуухгүй — гацсан frontend өмнө нь 10 минут
            # барьж байсан.
            timeout 30s docker rm -f "${STACK}_backend" "${STACK}_frontend" "${STACK}_migrate" 2>/dev/null || true
            # `up -d` эхлээд migrate-ийг дуустал ажиллуулаад API, frontend-ийг солино.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker logout ghcr.io
            docker image prune -f

      - name: Verify the deployment is healthy
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_DIR: ${{ env.APP_DIR }}
          STACK: ${{ env.STACK }}
          PUBLIC_ORIGIN: ${{ env.PUBLIC_ORIGIN }}
        with:
          host: ${{ secrets.DEPLOY_HOST || '5.45.65.164' }}
          username: ${{ secrets.DEPLOY_USER || 'deploy' }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_DIR,STACK,PUBLIC_ORIGIN
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/ready >/dev/null 2>&1; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "::error::backend never became ready"
                docker compose -f docker-compose.prod.yml ps
                docker logs --tail 100 "${STACK}_migrate" 2>&1 || true
                docker logs --tail 100 "${STACK}_backend" 2>&1 || true
                exit 1
              fi
              sleep 5
            done
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null -H "Host: ${PUBLIC_ORIGIN#https://}" http://127.0.0.1:3000/; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "::error::frontend never answered"
                docker logs --tail 100 "${STACK}_frontend" 2>&1 || true
                exit 1
              fi
              sleep 5
            done
            docker compose -f docker-compose.prod.yml ps

      # Public хаягийг хостоос биш, runner-ээс шалгана: хост өөрийн public IP
      # руу хандахад том хариу гацдаг (hairpin NAT), нэвтрэлтийн хуудас нь
      # тэр хэмжээнд хүрдэг. Redirect-ийг дагана — шинэ суулгац нүүрээ
      # /setup руу 307-оор чиглүүлдэг нь эрүүл хариу.
      - name: Verify the public address answers
        if: steps.guard.outputs.ready == 'true'
        run: |
          code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 60 "${PUBLIC_ORIGIN}/")
          echo "${PUBLIC_ORIGIN}/ → HTTP ${code}"
          [ "$code" = "200" ] || exit 1
          curl -fsS --max-time 30 "${PUBLIC_ORIGIN}/api/v1/setup/status" && echo
