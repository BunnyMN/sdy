# esdy — SDY-ийн гишүүдэд зориулсан native iOS апп.
#
# project.yml нь эх сурвалж; SDYMember.xcodeproj нь артефакт (.gitignore).
# Барихын өмнө `xcodegen generate` (build.sh үүнийг өөрөө хийнэ).
#
# Энэ төсөл бие даасан: native-apps/mobile эсвэл desktop-ийн эх кодыг
# компайлдахгүй. Хэдэн жижиг хэсгийг (Keychain, scenePhase resume) тэндээс
# хуулж, Apache-2.0 attribution-тай нь үлдээсэн.
name: SDYMember
options:
  bundleIdPrefix: mn.esdy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: mn

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: "$(SDY_TEAM_ID)"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"

targets:
  SDYMember:
    type: application
    platform: iOS
    sources:
      - path: SDYMember
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.esdy.member
        PRODUCT_NAME: SDYMember
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: SDYMember/Resources/SDYMember.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          # DEBUG-only sample data (-SDYFixtures) never ships.
          EXCLUDED_SOURCE_FILE_NAMES: "*/Resources/Fixtures/*.json"
    info:
      path: SDYMember/Resources/Info.plist
      properties:
        CFBundleDisplayName: esdy
        CFBundleDevelopmentRegion: mn
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.social-networking
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Арга хэмжээний ирцийн QR кодыг уншихад камер ашиглана.
        LSApplicationQueriesSchemes:
          - eidmongolia
          - geregesmartid
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Automatic

  SDYMemberTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SDYMemberTests
      - path: SDYMember/Resources/Fixtures
        buildPhase: resources
    dependencies:
      - target: SDYMember
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.esdy.member.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SDYMember.app/SDYMember"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SDYMember:
    build:
      targets:
        SDYMember: all
        SDYMemberTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SDYMemberTests
    archive:
      config: Release
